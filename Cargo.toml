[package]
name = "spkrd"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "FreeBSD speaker device network server"
license = "BSD-2-Clause"
repository = "https://github.com/yourusername/spkrd"
keywords = ["freebsd", "speaker", "network", "http", "server"]
categories = ["network-programming", "hardware-support"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
daemonize = "0.5"
log = "0.4"
env_logger = "0.11"
syslog = "7.0"
# Needed to set IPV6_V6ONLY before bind(); tokio's TcpListener::bind
# exposes no hook for socket options. See src/server.rs.
socket2 = { version = "0.6", features = ["all"] }
# Tracking upstream cpal 0.19.0-dev, which is not yet on crates.io.
# Needed for the draining `StreamTrait::stop(timeout)` added in
# RustAudio/cpal#1258, which closes RustAudio/cpal#1190 — the
# pipewire-pulse truncation bug spkrd used to work around with an
# explicit small BufferSize. Cargo.lock still pins an exact revision,
# so builds stay reproducible; `cargo update -p cpal` moves it
# forward deliberately.
#
# Revert to a plain crates.io requirement (`cpal = "0.19"`) as soon as
# 0.19.0 is released. Until then this branch must not be merged.
cpal = { git = "https://github.com/RustAudio/cpal", optional = true }

[features]
default = ["cpal"]
# Core CPAL audio output backend (synthesises MML to PCM via cpal).
cpal = ["dep:cpal"]
# JACK Audio Connection Kit support. Requires libjack at build and run time.
# Select at runtime with --cpal-host JACK.
jack = ["cpal", "cpal/jack"]
# PulseAudio support. Requires libpulse at build and run time.
# Selected automatically by cpal's default host when PipeWire is unavailable.
# Can also be forced with --cpal-host PulseAudio.
pulseaudio = ["cpal", "cpal/pulseaudio"]
# PipeWire support. Requires libpipewire at build and run time.
# Selected automatically by cpal's default host when available (highest priority).
# Can also be forced with --cpal-host PipeWire.
pipewire = ["cpal", "cpal/pipewire"]

[dev-dependencies]
reqwest = "0.12"
tempfile = "3.0"